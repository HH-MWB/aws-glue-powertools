[project]
name = "aws-glue-powertools"
version = "0.0.0"
description = "Powertools for AWS Glue is a developer toolkit to implement best practices and increase developer velocity."
readme = "README.md"
authors = [
    { name = "HH-MWB", email = "h.hong@mail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["behave", "coverage[toml]", "pre-commit"]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.behave]
paths = ["features"]

[tool.codespell]
skip = ".venv,uv.lock,*.svg"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.bandit]
exclude_dirs = [
    ".venv",
    "build",
    "dist",
    "features",
]

[tool.bandit.try_except_pass]
check_typed_exception = true

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "stubs"]
explicit_package_bases = true
strict = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
strict_equality = true
strict_equality_for_none = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "unimported-reveal",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
module = "features.steps.*"
disallow_untyped_decorators = false

[tool.pylint.main]
source-roots = ["src"]
ignore-paths = ["features/steps/"]

[tool.pylint.format]
max-line-length = 79

[tool.ruff]
line-length = 79
fix = true
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", # Incompatible with D211 (no-blank-line-before-class)
    "D213", # Incompatible with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.per-file-ignores]
"features/**" = [
    "S101", # Behave steps: assert is idiomatic for "then" checks
]
"stubs/**" = [
    "N802", # Stubs mirror upstream Glue names (e.g. getResolvedOptions)
]

[tool.ruff.lint.mccabe]
max-complexity = 5
