---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Run dependency audit
        run: uv audit

  test:
    name: Test (Glue ${{ matrix.glue-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        glue-version: ["5.0", "5.1", "6.0"]
    env:
      GLUE_VERSION: ${{ matrix.glue-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Run tests in AWS Glue container
        run: |
          chmod o+w .
          just coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: glue-${{ matrix.glue-version }}
          name: glue-${{ matrix.glue-version }}
          fail_ci_if_error: false

  build:
    name: Build
    needs:
      - lint
      - audit
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Build distribution artifacts
        run: uv build
