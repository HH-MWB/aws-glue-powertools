---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Run dependency audit
        run: uv audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Cache AWS Glue Docker image
        id: glue-image
        uses: actions/cache@v4
        with:
          path: /tmp/glue-image.tar
          key: docker-glue-libs-5

      - name: Load cached image
        if: steps.glue-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/glue-image.tar

      - name: Pull and save image
        if: steps.glue-image.outputs.cache-hit != 'true'
        run: |
          docker pull public.ecr.aws/glue/aws-glue-libs:5
          docker save public.ecr.aws/glue/aws-glue-libs:5 -o /tmp/glue-image.tar

      - name: Run Behave in AWS Glue Docker image
        run: just test

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - audit
      - test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Build distribution artifacts
        run: uv build
